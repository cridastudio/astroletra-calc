name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # JPL DE440 data for libephemeris (about 49 MB), cached between runs.
      LIBEPHEMERIS_DATA_DIR: ${{ github.workspace }}/.ephemeris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries for WeasyPrint (PDF tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Cache the ephemeris
        uses: actions/cache@v4
        with:
          path: .ephemeris
          key: ephemeris-libephemeris-3.2.2-leb2-base

      - name: Download the ephemeris (only when not cached)
        run: |
          if [ ! -d .ephemeris/leb ]; then libephemeris download leb2-base; fi
          libephemeris status || true

      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t astroletra-calc:ci .

      - name: Smoke test (health, today and natal)
        run: |
          docker run -d --name calc -e CALC_KEY=ci-key -p 8000:8000 astroletra-calc:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/v1/health && break; sleep 2; done
          curl -sf localhost:8000/v1/health | grep -q '"ok":true'
          curl -sf localhost:8000/v1/today -H "X-Calc-Key: ci-key" -H "content-type: application/json" \
            -d '{"date":"2026-11-24","tz":"Europe/Madrid"}' | grep -q '"moon"'
          curl -sf localhost:8000/v1/natal -H "X-Calc-Key: ci-key" -H "content-type: application/json" \
            -d '{"date":"1990-04-12","time":"08:30","lat":40.4168,"lon":-3.7038,"tz":"Europe/Madrid","house_system":"P"}' | grep -q '"planets"'
          docker logs calc | tail -20
